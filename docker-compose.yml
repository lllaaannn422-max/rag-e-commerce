version: '3.8'

services:
  # ===== MinIO 对象存储服务 =====
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: abcd1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ===== Milvus 依赖项 (Etcd) =====
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd

  # ===== Milvus 向量数据库服务 =====
  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: admin
      MINIO_SECRET_ACCESS_KEY: abcd1234
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # ===== Redis 多轮对话记忆（会话缓存，无需持久化） =====
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  # ===== RAG FastAPI 核心服务 =====
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MILVUS_URI=http://milvus-standalone:19530
      - MINIO_ENDPOINT=minio:9000
      - EMBED_URL=http://host.docker.internal:9997/v1/embeddings
      - RERANK_URL=http://host.docker.internal:9997/v1/rerank
      # 密钥从项目根目录 .env 读取（.env 不入库，模板见 .env.example）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000" # 暴露 FastAPI 服务端口
    # 生产环境使用 Gunicorn 启动 4 个 Uvicorn 工作进程，支持极高并发处理
    command: gunicorn api_server:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 120
    volumes:
      - ./docs:/app/docs
      - ./logs:/app/logs
    depends_on:
      - milvus-standalone
      - minio
      - redis

volumes:
  minio_data:
  etcd_data: